name: Build GeraKStoreWelcome dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify resources
        run: |
          echo "=== RESOURCES ==="
          ls -lh Resources/Config/*.json
          ls -lh Resources/Assets/GeraKStoreWelcome.png

      - name: Build dylib
        run: |
          xcrun --sdk iphoneos clang \
            -dynamiclib \
            -fobjc-arc \
            -miphoneos-version-min=14.0 \
            -install_name @rpath/GeraKStoreWelcome.dylib \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            Core/GeraKStoreWelcome.m \
            Core/WelcomeManager.m \
            Core/WelcomeViewController.m \
            Core/UserDefaults+Welcome.m \
            Core/EmbeddedResourceLoader.m \
            Configuration/WelcomeConfig.m \
            Configuration/Models/AppConfig.m \
            Configuration/Models/TextConfig.m \
            Configuration/Models/LinksConfig.m \
            Configuration/Models/AppearanceConfig.m \
            -I. \
            -IConfiguration \
            -IConfiguration/Models \
            -ICore \
            -sectcreate __DATA __welcome_config Resources/Config/config.json \
            -sectcreate __DATA __welcome_texts Resources/Config/texts.json \
            -sectcreate __DATA __welcome_links Resources/Config/links.json \
            -sectcreate __DATA __welcome_app Resources/Config/appearance.json \
            -sectcreate __DATA __welcome_logo Resources/Assets/GeraKStoreWelcome.png \
            -o GeraKStoreWelcome.dylib

      - name: Verify Mach-O
        run: |
          echo "=== FILE ==="
          file GeraKStoreWelcome.dylib

          echo
          echo "=== INSTALL NAME ==="
          xcrun --sdk iphoneos otool -D GeraKStoreWelcome.dylib

          echo
          echo "=== EMBEDDED SECTIONS ==="
          xcrun --sdk iphoneos otool -l GeraKStoreWelcome.dylib | grep -A5 -E "__welcome_config|__welcome_texts|__welcome_links|__welcome_app|__welcome_logo"

      - name: Package dylib
        run: |
          mkdir -p build/GeraKStoreWelcome.framework
          cp GeraKStoreWelcome.dylib build/GeraKStoreWelcome.framework/
          cp -R Resources/Config build/GeraKStoreWelcome.framework/
          cp Resources/Assets/GeraKStoreWelcome.png build/GeraKStoreWelcome.framework/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeraKStoreWelcome
          path: |
            GeraKStoreWelcome.dylib
            build/GeraKStoreWelcome.framework/
