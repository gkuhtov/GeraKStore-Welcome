name: Build GeraKStoreWelcome dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          xcrun --sdk iphoneos clang \
            -dynamiclib \
            -fobjc-arc \
            -miphoneos-version-min=14.0 \
            -install_name @rpath/GeraKStoreWelcome.dylib \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            Core/GeraKStoreWelcome.m \
            Core/WelcomeManager.m \
            Core/WelcomeViewController.m \
            Core/UserDefaults+Welcome.m \
            Configuration/WelcomeConfig.m \
            Configuration/Models/AppConfig.m \
            Configuration/Models/TextConfig.m \
            Configuration/Models/LinksConfig.m \
            Configuration/Models/AppearanceConfig.m \
            -I. \
            -IConfiguration \
            -IConfiguration/Models \
            -ICore \
            -o GeraKStoreWelcome.dylib

      - name: Verify Mach-O
        run: |
          echo "=== FILE ==="
          file GeraKStoreWelcome.dylib

          echo
          echo "=== INSTALL NAME ==="
          xcrun --sdk iphoneos otool -D GeraKStoreWelcome.dylib

          echo
          echo "=== DEPENDENCIES ==="
          xcrun --sdk iphoneos otool -L GeraKStoreWelcome.dylib

          echo
          echo "=== CHECK ==="
          EXPECTED="@rpath/GeraKStoreWelcome.dylib"
          ACTUAL="$(xcrun --sdk iphoneos otool -D GeraKStoreWelcome.dylib | tail -n 1)"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: wrong install name"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "OK: install name is correct"

      - name: Package dylib
        run: |
          mkdir -p build/GeraKStoreWelcome.framework
          cp GeraKStoreWelcome.dylib build/GeraKStoreWelcome.framework/
          cp -R Resources/Config build/GeraKStoreWelcome.framework/
          cp Resources/Assets/GeraKStoreWelcome.png build/GeraKStoreWelcome.framework/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeraKStoreWelcome
          path: |
            GeraKStoreWelcome.dylib
            build/GeraKStoreWelcome.framework/
