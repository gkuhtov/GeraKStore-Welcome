name: Build WelcomeToJapan Dylib

on:
  push:
    branches:
      - main
    paths:
      - "WelcomeToJapan/**"
      - ".github/workflows/build-welcome-to-japan.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          echo "Setting up build environment..."

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build Tweak
        run: |
          export THEOS=~/theos
          cd WelcomeToJapan
          make clean
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WelcomeToJapan-deb
          path: WelcomeToJapan/packages/*.deb
